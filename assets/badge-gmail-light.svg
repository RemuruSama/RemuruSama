<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with proper pill shape -->
  <rect width="200" height="50" rx="25" fill="#FEF3F3" stroke="#EA4335" stroke-width="1.5"/>
  
  <!-- Gmail Logo (centered in left circle) -->
  <g transform="translate(25, 25)">
    <!-- Envelope base -->
    <rect x="-10" y="-7" width="20" height="14" rx="1.5" fill="#EA4335"/>
    <!-- Folded parts -->
    <path d="M-10 -7 L0 1 L10 -7" fill="#C5221F"/>
    <path d="M10 -7 L10 7 L6 3 L10 -7" fill="#FBBC04"/>
    <path d="M-10 -7 L-10 7 L-6 3 L-10 -7" fill="#34A853"/>
    <!-- Front flap -->
    <path d="M-10 -7 L0 1 L10 -7" stroke="white" stroke-width="0.5" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="55" y="32" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#C5221F">abhinavftp98</text>
</svg>