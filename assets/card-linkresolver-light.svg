<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150" role="img" aria-label="Link Resolver: Android utility for resolving and handling download links.">
  <title>Link Resolver</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6ff"/></linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#6d28d9" stop-opacity=".18"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="400" height="150" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Inter","Helvetica Neue",Arial,system-ui,sans-serif;font-weight:700;font-size:21px;fill:#1f2340}
    .d{font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Inter","Helvetica Neue",Arial,system-ui,sans-serif;font-size:15px;fill:#4b5563}
    .halo{fill:none;stroke:#6d28d9;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 3.6s ease-out -0.9s infinite}
    @keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="400" height="150" fill="url(#bg)"/>
    <rect width="400" height="150" fill="url(#gl)"/>
    <circle class="halo" cx="48" cy="48" r="24"/>
    <rect x="24" y="24" width="48" height="48" rx="14" fill="#6d28d9" fill-opacity=".12" stroke="#6d28d9" stroke-opacity=".4" stroke-width="1.5"/>
    <g transform="translate(34.2 34.2) scale(1.15)" fill="none" stroke="#6d28d9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="8.5" width="12.5" height="7" rx="3.5" transform="rotate(-35 7.75 12)"/><rect x="10" y="8.5" width="12.5" height="7" rx="3.5" transform="rotate(-35 16.25 12)"/></g>
    <text class="t" x="88" y="55">Link Resolver</text>
    <text class="d" x="24" y="107">Android utility for resolving and</text>
    <text class="d" x="24" y="129">handling download links.</text>
  </g>
  <rect x=".75" y=".75" width="398.5" height="148.5" rx="15.5" fill="none" stroke="#d5dbea" stroke-width="1.5"/>
</svg>
